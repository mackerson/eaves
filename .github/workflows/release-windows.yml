name: Release (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Point yarn at Git Bash for script execution
        # Package.json scripts use Unix-isms (mkdir -p, cp -rL, rm -rf) that
        # die under cmd.exe. Git Bash ships with windows-latest.
        run: yarn config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

      - name: Clone bundled plugins
        run: |
          set -euo pipefail
          mkdir -p plugins
          # Only clone tier:bundled plugins — these are the ones that ship.
          # qa/example/community plugins are intentionally excluded.
          jq -c '.plugins[] | select(.tier == "bundled")' bundled-plugins.json | while read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            repo=$(echo "$entry" | jq -r '.repo')
            ref=$(echo "$entry" | jq -r '.ref')
            dest="plugins/$name"
            if [ -d "$dest/.git" ]; then
              echo "Skipping $name (already present)"
              continue
            fi
            rm -rf "$dest"
            echo "Cloning $repo@$ref -> $dest"
            git clone --depth 1 --branch "$ref" \
              "https://github.com/${repo}.git" \
              "$dest"
          done

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Read app version
        id: ver
        # Surfaces the package.json version so the artifact name is unique per
        # build — no more "enclave-windows-x64 (2).zip" on repeat downloads.
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package (Windows x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Call the bin directly. `yarn electron-builder` hands the Windows-style
        # path to Git Bash, which consumes backslashes as escapes.
        run: ./node_modules/.bin/electron-builder --win --x64 --publish=never

      # Primary delivery: attach the installer to a DRAFT GitHub Release. Draft
      # releases don't create a git tag and don't count against the Actions
      # artifact storage quota, and it is the release electron-updater actually
      # reads. Draft and prerelease are both deliberately absent: electron-updater
      # ignores drafts entirely and skips prereleases unless allowPrerelease is
      # set, so a draft ships files nobody's installer will ever see.
      #
      # Uploads to the release if it already exists, because another platform
      # (Linux, macOS) may have published the same version first. --clobber lets
      # a re-run replace its own artifacts instead of failing.
      - name: Publish installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.ver.outputs.version }}"
          files=(release/*.exe release/*.exe.blockmap release/latest.yml)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            echo "Attached Windows x64 artifacts to existing release $tag"
          else
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "Enclave ${{ steps.ver.outputs.version }}" \
              --notes "Windows x64 build from \`${{ github.sha }}\`. **Unsigned** — SmartScreen will warn on first run." \
              "${files[@]}"
            echo "Created release $tag"
          fi

      # Fallback: also try the artifact store. Non-fatal — when the quota is full
      # this step fails but the release above already has the installer.
      - name: Upload installer artifact (fallback)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: enclave-windows-${{ steps.ver.outputs.version }}-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: warn
