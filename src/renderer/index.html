<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enclave AI</title>
    <!--
      React resolution for plugin UI bundles is handled at runtime, not via an
      import map: dev uses the vite.config.ts middleware; packaged builds use the
      enclave-module: scheme (see src/main/protocols/moduleShim.ts). A static
      importmap here was inert (bundles emit absolute /node_modules/react paths,
      which import maps do not rewrite) and tripped the prod CSP.
    -->
  </head>
  <body style="margin: 0; background: hsl(240 10% 3.9%);">
    <div id="root">
      <!-- Loading fallback shown until React mounts -->
      <div id="app-loading" style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: hsl(240 10% 3.9%);
        color: hsl(0 0% 98%);
        font-family: system-ui, -apple-system, sans-serif;
      ">
        <div style="
          width: 40px;
          height: 40px;
          border: 3px solid hsl(240 3.7% 15.9%);
          border-top-color: hsl(0 0% 98%);
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>
        <p style="margin-top: 16px; color: hsl(240 5% 64.9%);">Loading Enclave...</p>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
