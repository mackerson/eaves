<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="149mm"
   height="149mm"
   viewBox="0 0 149 149"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dark-halo" x="-20%" y="-20%" width="140%" height="140%"
            color-interpolation-filters="sRGB">
      <!-- Flood with dark semi-transparent color -->
      <feFlood flood-color="#000000" flood-opacity="0.45" result="color" />
      <!-- Use the glyph shape as the mask for the flood -->
      <feComposite in="color" in2="SourceGraphic" operator="in" result="shadow-shape" />
      <!-- Blur it out to create the halo -->
      <feGaussianBlur in="shadow-shape" stdDeviation="4" result="halo" />
      <!-- Layer: halo behind, then original glyph on top -->
      <feMerge>
        <feMergeNode in="halo" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
